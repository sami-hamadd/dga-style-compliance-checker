<!DOCTYPE html>
<html lang="en">
       <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Design System UI</title>
              <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
              <style>
                     html {
                            font-family: "IBM Plex Sans", sans-serif;
                            line-height: 24px;
                            background-color: rgb(252, 252, 253);
                     }

                     body {
                            font-family: "IBM Plex Sans", sans-serif;
                            background-color: rgb(249, 250, 251);
                            color: rgb(22, 22, 22);
                            margin: 0;
                            padding: 0;
                            text-align: center;
                            line-height: 24px;
                     }

                     .container {
                            width: 80%;
                            max-width: 1280px;
                            margin: 60px auto;
                            background: rgb(243, 244, 246);
                            padding: 32px 0;
                            box-shadow: 0px 12px 16px -4px rgba(16, 24, 40, 0.08), 0px 4px 6px -2px rgba(16, 24, 40, 0.03);
                            border-radius: 10px;
                            line-height: 24px;
                            backdrop-filter: blur(16px);
                     }

                     h1 {
                            font-size: 72px;
                            line-height: 80px;
                            font-weight: 700;
                            color: rgb(37, 147, 95);
                            margin: 50px;
                            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
                     }

                     h2 {
                            margin: 80px 0;
                            font-size: 60px;
                            line-height: 72px;
                            font-weight: 600;
                            color: rgb(24, 73, 169);
                            margin-bottom: 20px;
                     }

                     p {
                            font-size: 18px;
                            margin: 8px 0;
                            line-height: 28px;
                            font-weight: 400;
                            color: rgb(77, 87, 97);
                            margin-bottom: 30px;
                            max-width: 720px;
                            margin-left: auto;
                            margin-right: auto;
                     }

                     .btn {
                            width: 320px;
                            margin-top: 2px;
                            line-height: 30px;
                            display: inline-block;
                            padding: 12px 24px;
                            font-size: 20px;
                            font-weight: 600;
                            color: white;
                            background-color: rgb(27, 131, 84);
                            border: none;
                            border-radius: 8px;
                            cursor: pointer;
                            transition: background 0.3s;
                            font-family: "IBM Plex Sans", sans-serif;
                            box-shadow: 0px 4px 8px -2px rgba(16, 24, 40, 0.1), 0px 2px 4px -2px rgba(16, 24, 40, 0.06);
                     }

                     .btn:hover {
                            background-color: rgb(22, 106, 69);
                            box-shadow: 0px 4px 8px -2px rgba(16, 24, 40, 0.1), 0px 2px 4px -2px rgba(16, 24, 40, 0.06);
                     }

                     .alert {
                            padding: 15px 0;
                            margin-top: 20px;
                            font-size: 18px;
                            font-weight: 500;
                            border-radius: 5px;
                            text-align: center;
                            width: 80%;
                            max-width: 1024px;
                            margin-left: auto;
                            margin-right: auto;
                            line-height: 28px;
                            box-shadow: 0px 4px 8px -2px rgba(16, 24, 40, 0.1), 0px 2px 4px -2px rgba(16, 24, 40, 0.06);
                            backdrop-filter: blur(8px);
                     }

                     .alert-success {
                            background: rgb(7, 148, 85);
                            color: white;
                     }

                     .alert-error {
                            background: rgb(180, 35, 24);
                            color: white;
                     }

                     .alert-warning {
                            background: rgb(253, 176, 34);
                            color: #000;
                     }
                     /* center */
                     .grid-container {
                            display: grid;
                            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                            justify-items: center;
                            max-width: 1024px;
                            margin: 32px auto;
                     }

                     .grid-item {
                            background: rgb(243, 244, 246);
                            padding: 16px 42px;
                            box-shadow: 0px 4px 8px -2px rgba(16, 24, 40, 0.1), 0px 2px 4px -2px rgba(16, 24, 40, 0.06);
                            text-align: center;
                            border-radius: 8px;
                     }
              </style>
       </head>
       <body>
              <div class="container">
                     <h1 class="class-h1">Welcome to Platforms Code</h1>
                     <h2 class="class-h2">Typography & Colors Applied</h2>
                     <p class="class-p">This page follows the design system rules for colors, typography, spacing, and layout.</p>
                     <button class="btn">Click Me</button>

                     <div class="alert alert-success">Success Message Example</div>
                     <div class="alert alert-error">Error Message Example</div>
                     <div class="alert alert-warning">Warning Message Example</div>
              </div>

              <div class="grid-container">
                     <div class="item1 grid-item">Grid Item 1</div>
                     <div class="item2 grid-item">Grid Item 2</div>
                     <div class="item3 grid-item">Grid Item 3</div>
              </div>
       </body>
</html>
